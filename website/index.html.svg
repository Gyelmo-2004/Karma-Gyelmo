<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Employee Attendance Dashboard</title>
  <desc id="d">Summary tiles, weekly attendance bar chart and a list of employees with status.</desc>

  <!-- EDIT COLORS / FONTS HERE -->
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
    .h1{font-size:24px;font-weight:700;fill:#1d2433}
    .sub{font-size:13px;fill:#6b7385}
    .panel{fill:#ffffff;stroke:#e3e6ee}
    .num{font-size:28px;font-weight:700}
    .lbl{font-size:12px;fill:#6b7385}
    .ptitle{font-size:14px;font-weight:600;fill:#1d2433}
    .axis{stroke:#e3e6ee}
    .bar{fill:#3b5bdb}
    .barlow{fill:#9db0f5}
    .val{font-size:11px;font-weight:600;fill:#1d2433;text-anchor:middle}
    .day{font-size:12px;fill:#6b7385;text-anchor:middle}
    .name{font-size:13px;font-weight:600;fill:#1d2433}
    .dept{font-size:11px;fill:#6b7385}
    .pilltxt{font-size:11px;font-weight:600;text-anchor:middle}
    .present{fill:#e6f6ea}.present-t{fill:#2f9e44}
    .late{fill:#fff1dc}.late-t{fill:#e8890c}
    .absent{fill:#fde8e8}.absent-t{fill:#e03131}
    .leave{fill:#efe9fd}.leave-t{fill:#7048e8}
  </style>

  <!-- Background -->
  <rect id="background" width="800" height="520" rx="20" fill="#f5f6fa"/>

  <!-- Header -->
  <g id="header">
    <text class="h1" x="40" y="60">Employee Attendance</text>
    <text class="sub" x="40" y="82">Today · Office team</text>
    <!-- calendar icon -->
    <g id="calendar-icon" transform="translate(716 34)">
      <rect width="44" height="44" rx="10" fill="#3b5bdb"/>
      <rect x="10" y="14" width="24" height="20" rx="3" fill="none" stroke="#fff" stroke-width="2"/>
      <path d="M10 20h24M16 10v6M28 10v6" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <path d="M16 27l4 4 8-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Stat tiles -->
  <g id="stats">
    <g id="stat-present">
      <rect class="panel" x="40" y="104" width="170" height="80" rx="12"/>
      <rect x="40" y="104" width="6" height="80" rx="3" fill="#2f9e44"/>
      <text class="num" x="62" y="146" fill="#2f9e44">24</text>
      <text class="lbl" x="62" y="168">Present</text>
    </g>
    <g id="stat-late">
      <rect class="panel" x="226" y="104" width="170" height="80" rx="12"/>
      <rect x="226" y="104" width="6" height="80" rx="3" fill="#e8890c"/>
      <text class="num" x="248" y="146" fill="#e8890c">3</text>
      <text class="lbl" x="248" y="168">Late</text>
    </g>
    <g id="stat-absent">
      <rect class="panel" x="412" y="104" width="170" height="80" rx="12"/>
      <rect x="412" y="104" width="6" height="80" rx="3" fill="#e03131"/>
      <text class="num" x="434" y="146" fill="#e03131">2</text>
      <text class="lbl" x="434" y="168">Absent</text>
    </g>
    <g id="stat-leave">
      <rect class="panel" x="598" y="104" width="170" height="80" rx="12"/>
      <rect x="598" y="104" width="6" height="80" rx="3" fill="#7048e8"/>
      <text class="num" x="620" y="146" fill="#7048e8">1</text>
      <text class="lbl" x="620" y="168">On leave</text>
    </g>
  </g>

  <!-- Weekly chart -->
  <g id="weekly-chart">
    <rect class="panel" x="40" y="204" width="360" height="276" rx="14"/>
    <text class="ptitle" x="60" y="234">Weekly attendance (%)</text>
    <line class="axis" x1="56" y1="440" x2="384" y2="440"/>
    <line class="axis" x1="56" y1="360" x2="384" y2="360" stroke-dasharray="3 4"/>
    <line class="axis" x1="56" y1="280" x2="384" y2="280" stroke-dasharray="3 4"/>
    <!-- bars: height = percent * 1.6 ; y = 440 - height -->
    <rect class="bar" x="72"  y="293" width="40" height="147" rx="6"/>
    <rect class="bar" x="136" y="299" width="40" height="141" rx="6"/>
    <rect class="bar" x="200" y="288" width="40" height="152" rx="6"/>
    <rect class="bar" x="264" y="304" width="40" height="136" rx="6"/>
    <rect class="barlow" x="328" y="315" width="40" height="125" rx="6"/>
    <text class="val" x="92"  y="287">92</text>
    <text class="val" x="156" y="293">88</text>
    <text class="val" x="220" y="282">95</text>
    <text class="val" x="284" y="298">85</text>
    <text class="val" x="348" y="309">78</text>
    <text class="day" x="92"  y="460">Mon</text>
    <text class="day" x="156" y="460">Tue</text>
    <text class="day" x="220" y="460">Wed</text>
    <text class="day" x="284" y="460">Thu</text>
    <text class="day" x="348" y="460">Fri</text>
  </g>

  <!-- Employee list -->
  <g id="employee-list">
    <rect class="panel" x="416" y="204" width="352" height="276" rx="14"/>
    <text class="ptitle" x="436" y="234">Today's check-ins</text>

    <g id="row-1">
      <circle cx="450" cy="272" r="16" fill="#dbe4ff"/>
      <text x="450" y="277" font-size="12" font-weight="700" fill="#3b5bdb" text-anchor="middle">AK</text>
      <text class="name" x="476" y="270">Aisha Khan</text>
      <text class="dept" x="476" y="286">Engineering · 08:52</text>
      <rect class="present" x="672" y="260" width="80" height="24" rx="12"/>
      <text class="pilltxt present-t" x="712" y="276">Present</text>
    </g>
    <line class="axis" x1="436" y1="302" x2="748" y2="302"/>

    <g id="row-2">
      <circle cx="450" cy="332" r="16" fill="#ffe8cc"/>
      <text x="450" y="337" font-size="12" font-weight="700" fill="#e8890c" text-anchor="middle">TD</text>
      <text class="name" x="476" y="330">Tenzin Dorji</text>
      <text class="dept" x="476" y="346">Design · 09:48</text>
      <rect class="late" x="672" y="320" width="80" height="24" rx="12"/>
      <text class="pilltxt late-t" x="712" y="336">Late</text>
    </g>
    <line class="axis" x1="436" y1="362" x2="748" y2="362"/>

    <g id="row-3">
      <circle cx="450" cy="392" r="16" fill="#e5dbff"/>
      <text x="450" y="397" font-size="12" font-weight="700" fill="#7048e8" text-anchor="middle">ML</text>
      <text class="name" x="476" y="390">Maria Lopez</text>
      <text class="dept" x="476" y="406">HR · Approved leave</text>
      <rect class="leave" x="672" y="380" width="80" height="24" rx="12"/>
      <text class="pilltxt leave-t" x="712" y="396">On leave</text>
    </g>
    <line class="axis" x1="436" y1="422" x2="748" y2="422"/>

    <g id="row-4">
      <circle cx="450" cy="452" r="16" fill="#ffe3e3"/>
      <text x="450" y="457" font-size="12" font-weight="700" fill="#e03131" text-anchor="middle">CW</text>
      <text class="name" x="476" y="450">Chen Wei</text>
      <text class="dept" x="476" y="466">Finance · No check-in</text>
      <rect class="absent" x="672" y="440" width="80" height="24" rx="12"/>
      <text class="pilltxt absent-t" x="712" y="456">Absent</text>
    </g>
  </g>
</svg>
