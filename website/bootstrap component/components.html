<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">

                <div class="card shadow">
                    <div class="card-body p-4">

                      

                        <form>
                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    Email address
                                </label>
                                <input type="email" class="form-control"
                                       id="email" placeholder="Enter email">
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    Password
                                </label>
                                <input type="password" class="form-control"
                                       id="password" placeholder="Enter password">
                            </div>

                            <div class="form-check mb-3">
                                <input type="checkbox" class="form-check-input"
                                       id="remember">
                                <label for="remember" class="form-check-label">
                                    Remember me
                                </label>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                Sign in

                            </button>
                            <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#confirm">Delete</button>

<div class="modal fade" id="confirm" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Delete file?</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                This cannot be undone.
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-danger">Delete</button>
            </div>

        </div>
    </div>
</div>

                            
                            <select class="form-select"><option>Thimphu</option><option>Paro</option></select>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="cl">
                                <label class="form-check-label" for="cl">Subscribe</label>

                            </div>
                            <div class="form-check"><input class="form-check-input" type="radio" name="r"></div>
                            <div class="form-check form-switch"><input class="form-check-input" type="checkbox"></div>
                            

                        </form>


                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
